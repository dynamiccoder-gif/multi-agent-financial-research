services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: market_risk_postgres
    environment:
      POSTGRES_DB: market_risk
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_risk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
